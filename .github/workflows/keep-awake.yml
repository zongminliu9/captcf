# Keeps the Render free-plan web service awake so learners (and paying customers) never hit the
# ~1 minute cold start. Render spins a free service down after 15 min without traffic; a ping
# every 10 min prevents that. Free: Actions minutes are unlimited on public repositories.
#
# Override the URL with a repository variable KEEP_AWAKE_URL (Settings → Variables → Actions),
# e.g. once a custom domain is attached. GitHub may delay scheduled runs by a few minutes, and
# pauses schedules after 60 days without repository activity (re-enable in the Actions tab).
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.KEEP_AWAKE_URL || 'https://captcf.onrender.com' }}
        run: curl -fsS --max-time 120 --retry 2 --retry-delay 10 "$URL/api/health"
